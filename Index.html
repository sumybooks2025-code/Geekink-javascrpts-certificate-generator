<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SumyTech School</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- html2canvas -->
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<link rel="stylesheet" href="style.css">

<style>
.watermark{
position:absolute;
opacity:0.08;
width:300px;
top:50%;
left:50%;
transform:translate(-50%,-50%);
pointer-events:none;
}
</style>

</head>

<body class="bg-gray-100 p-6">

<div class="max-w-4xl mx-auto bg-white p-6 rounded shadow-lg">

<h1 class="text-3xl font-bold text-center mb-6">
🎓 SumyTech School
</h1>

<!-- CSV DOWNLOAD -->
<div class="mb-4 text-right">
<a href="students.csv" download
class="text-blue-600 underline hover:text-blue-800">
📥 Download Students CSV
</a>
</div>

<!-- ===============================
     STUDENT SEARCH AND SELECTION
================================ -->
<div class="w-full max-w-md space-y-3 mb-6">

  <!-- Search Student -->
  <div>
    <label for="searchStudent" class="block text-sm font-semibold mb-1">
      Search Student
    </label>

    <input
      id="searchStudent"
      type="text"
      placeholder="Search student name..."
      class="border border-gray-300 p-2 rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-400"
    >
  </div>

  <!-- Student Dropdown -->
  <div>
    <label for="studentSelect" class="block text-sm font-semibold mb-1">
      Choose Student
    </label>

    <select
      id="studentSelect"
      class="border border-gray-300 p-2 rounded w-full bg-white focus:outline-none focus:ring-2 focus:ring-blue-400"
    >
      <option value="">Select Student</option>
    </select>
  </div>

  <button onclick="fillStudentData()"
  class="mt-2 bg-blue-500 text-white px-4 py-2 rounded">
  Choose
  </button>

</div>

<!-- FORM -->
<div class="grid md:grid-cols-3 gap-4 mb-6">

<input id="studentName" type="text"
placeholder="Student Name"
class="border p-2 rounded w-full">

<input id="courseName" type="text"
placeholder="Course Name"
class="border p-2 rounded w-full">

<input id="completionDate" type="date"
class="border p-2 rounded w-full">

</div>

<div class="flex gap-4 mb-6">

<button onclick="generateCertificate()"
class="bg-blue-600 text-white px-4 py-2 rounded">
Generate Certificate
</button>

<button onclick="downloadCertificate()"
class="bg-green-600 text-white px-4 py-2 rounded">
Download Certificate
</button>

</div>

<!-- CERTIFICATE -->
<div id="certificate"
class="relative bg-white border-8 border-blue-800 p-10 text-center overflow-hidden">

<!-- WATERMARK LOGO -->
<img src="logo.png" class="watermark" alt="SumyTech School">

<h2 class="text-4xl font-bold mb-4">
Certificate of Completion
</h2>

<p class="text-lg mb-4">
This is to certify that
</p>

<h3 id="previewName"
class="text-3xl font-semibold text-blue-700">
Student Name
</h3>

<p class="mt-4">
has successfully completed
</p>

<h3 id="previewCourse"
class="text-2xl font-semibold mt-2">
Course Name
</h3>

<p class="mt-4">
Date: <span id="previewDate">Completion Date</span>
</p>

<p class="mt-8 font-bold">
Instructor: SumyTech School
</p>

</div>

</div>

<script src="index.js"></script>

</body>
        </html>
